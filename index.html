<!doctype html><html lang="de"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta http-equiv="X-UA-Compatible" content="ie=edge"><title>To Do List</title><link rel="stylesheet" href="3240886698463ebf64b2.css"/><script defer="defer" src="index.js"></script></head><body><header><h1>To Do List</h1><button id="delete-completed">Erledigte Aufgaben löschen</button></header><main><div class="todo"><form id="add-task-form" class="task-form"><select class="priority-select" name="priority"><option class="priority-low" value="0">Niedrig</option><option class="priority-medium" value="1">Mittel</option><option class="priority-high" value="2">Hoch</option></select> <input name="name" placeholder="Aufgabenname"> <input type="date" name="due-date" placeholder="Due date"><submit class="add-button"><img src="af3b66aebbb2d4b249a2.svg" alt="Add icon"></submit></form><template id="task-template"><li class="task" data-task-id="0"><div class="task-info"><button class="checkbox-button"><img class="unselected" src="eff8259bcf4bdcc0f191.svg" alt="Checkbox icon"> <img class="selected" src="d08d8de475d6192f4fd4.svg" alt="Selected checkbox icon"></button> <span class="task-name">Einkaufen gehen</span> <span class="due-date"></span> <button class="edit-button"><img src="e66f40b42b9d067d459d.svg" alt="Edit icon"></button> <button class="delete-button"><img src="67aee4004d503cf04ef4.svg" alt="Delete icon"></button></div><div class="task-edit"><form class="task-form"><select class="priority-select" name="priority"><option class="priority-low" value="0">Niedrig</option><option class="priority-medium" value="1">Mittel</option><option class="priority-high" value="2">Hoch</option></select> <input name="name" placeholder="Aufgabenname"> <input type="date" name="due-date" placeholder="Due date"><submit class="save-button"><img src="bef46f2623a7f89cc862.svg" alt="Save icon"></submit></form></div></li></template><ul class="todo-list"></ul></div></main><footer><p>Copyright &copy; 2024</p></footer></body></html>
